services:
  - type: web
    name: klvro
    runtime: node
    plan: free
    region: virginia
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    autoDeployTrigger: commit
    domains:
      - klvro.site
    envVars:
      - key: NODE_ENV
        value: production
      - key: PUBLIC_URL
        value: https://klvro.site
      # Usa el connection string de Supabase. No se crea ninguna DB en Render.
      - key: DATABASE_URL
        sync: false
      - key: PGPOOL_MAX
        value: "5"
      - key: SESSION_SECRET
        generateValue: true
      - key: DISCORD_CLIENT_ID
        sync: false
      - key: DISCORD_CLIENT_SECRET
        sync: false
      - key: DISCORD_BOT_TOKEN
        sync: false
      - key: DISCORD_REDIRECT_URI
        value: https://klvro.site/auth/discord/callback
      - key: REGISTER_COMMANDS
        value: "true"
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_MODE
        value: sandbox
